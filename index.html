<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Clicker</title>
    <!-- Официальный скрипт Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #1f2125);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        #score {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 30px;
            color: var(--tg-theme-button-color, #3a9688);
        }
        .coin {
            width: 150px;
            height: 150px;
            background: linear-gradient(135deg, #fbc531, #e1b12c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(251, 197, 49, 0.4);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            margin: 0 auto;
        }
        .coin:active {
            transform: scale(0.92);
            box-shadow: 0 5px 15px rgba(251, 197, 49, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Тапай по монете!</h1>
        <div id="score">0</div>
        <div class="coin" id="clickBtn">🪙</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
