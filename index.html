<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Clicker Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #1a1a1a);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --button-color: var(--tg-theme-button-color, #3a9688);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 90vh;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 5px 0;
            opacity: 0.8;
        }

        #score {
            font-size: 48px;
            font-weight: bold;
            color: #fbc531;
            text-shadow: 0 2px 10px rgba(251, 197, 49, 0.3);
        }

        .stats {
            font-size: 14px;
            opacity: 0.6;
            margin-top: 5px;
        }

        .game-area {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .coin {
            width: 160px;
            height: 160px;
            background: linear-gradient(135deg, #fbc531, #e1b12c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(251, 197, 49, 0.4);
            transition: transform 0.08s ease, box-shadow 0.08s ease;
        }

        .coin:active {
            transform: scale(0.92);
            box-shadow: 0 5px 15px rgba(251, 197, 49, 0.2);
        }

        /* Всплывающие цифры при клике */
        .floating-num {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #fbc531;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }

            100% {
                transform: translateY(-80px) scale(1.3);
                opacity: 0;
            }
        }

        /* Магазин улучшений */
        .shop {
            width: 100%;
            max-width: 320px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 15px;
            box-sizing: border-box;
        }

        .shop h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            text-align: center;
        }

        .upgrade-btn {
            width: 100%;
            background: var(--button-color);
            color: var(--button-text);
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: opacity 0.2s;
        }

        .upgrade-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Ваш баланс</h1>
        <div id="score">0</div>
        <div class="stats" id="perSec">Доход в сек: 0</div>
    </div>

    <div class="game-area" id="gameArea">
        <div class="coin" id="clickBtn">🪙</div>
    </div>

    <div class="shop">
        <h3>🛒 Магазин улучшений</h3>
        <button class="upgrade-btn" id="buyUpgrade" disabled>
            <span>+1 к силе тапа</span>
            <span id="upgradeCost">🪙 15</span>
        </button>
    </div>

    <script src="app.js"></script>
</body>

</html>
